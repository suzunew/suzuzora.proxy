<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101827">
  <meta name="description" content="suzuzora proxy - シンプルで軽量な日本語優先Webブラウザー">
  <title>suzuzora proxy</title>
  <link rel="stylesheet" href="/style.css">
  <script defer src="/transport/index.js"></script>
  <script defer src="/engine/uv.bundle.js"></script>
  <script defer src="/proxy.config.js"></script>
  <script defer src="/register-sw.js"></script>
  <script defer src="/app.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="suzuzora proxy ホーム">
      <span class="brand-icon" aria-hidden="true">s</span>
      <span>suzuzora <b>proxy</b></span>
    </a>
    <span class="ready"><i></i>利用できます</span>
  </header>

  <main>
    <section id="home" class="home">
      <div class="eyebrow">JAPANESE-FIRST WEB</div>
      <h1>見たいページへ、<span>すぐアクセス。</span></h1>
      <p class="intro">URLまたは検索ワードを入力してください。</p>

      <form id="proxy-form" class="searchbar" autocomplete="off">
        <span class="search-icon" aria-hidden="true">⌕</span>
        <input id="address" type="text" inputmode="url" placeholder="URL・検索ワードを入力..." spellcheck="false" autofocus>
        <button type="submit">開く <span aria-hidden="true">→</span></button>
      </form>

      <div class="quick-links" aria-label="クイックアクセス">
        <button type="button" data-url="https://duckduckgo.com/?kl=jp-jp">DuckDuckGo</button>
        <button type="button" data-url="https://ja.wikipedia.org/">Wikipedia 日本語</button>
        <button type="button" data-url="https://www.youtube.com/?hl=ja">YouTube</button>
      </div>
      <p class="language-note">日本語を優先して表示します。サイト側が日本語に対応していない場合は、元の言語で表示されます。</p>
      <p id="error" class="error" role="status" aria-live="polite"></p>
    </section>

    <section id="browser" class="browser hidden" aria-label="Webブラウザー">
      <div class="browser-toolbar">
        <button id="back" type="button" title="戻る" aria-label="戻る">←</button>
        <button id="forward" type="button" title="進む" aria-label="進む">→</button>
        <button id="refresh" type="button" title="再読み込み" aria-label="再読み込み">↻</button>
        <div id="current-url" class="current-url">接続先</div>
        <button id="close-browser" type="button" title="ホームへ戻る" aria-label="ホームへ戻る">×</button>
      </div>
      <iframe id="web-frame" title="閲覧ページ" referrerpolicy="no-referrer" allow="fullscreen; autoplay; clipboard-read; clipboard-write"></iframe>
    </section>
  </main>

  <footer>suzuzora proxy <span>·</span> シンプルなWeb閲覧ツール</footer>
</body>
</html>
